// Configuración Final de Deployment para Micro-frontends Médicos - Altamedica
// Docker + Kubernetes + CI/CD optimizado para compliance HIPAA

version: '3.8'

services:
  # Shell principal de micro-frontends
  altamedica-shell:
    build:
      context: .
      dockerfile: Dockerfile.shell
      args:
        NODE_ENV: production
        MEDICAL_COMPLIANCE_MODE: HIPAA
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_MEDICAL_COMPLIANCE=HIPAA
      - NEXT_PUBLIC_ENCRYPTION_ENABLED=true
      - NEXT_PUBLIC_AUDIT_LOGGING=true
      - NEXT_PUBLIC_PERFORMANCE_MONITORING=true
      - NEXT_PUBLIC_MICROFRONTEND_MODE=enabled
    networks:
      - altamedica-network
    depends_on:
      - altamedica-api
      - redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Micro-frontend: Patient Management
  patient-management:
    build:
      context: .
      dockerfile: Dockerfile.patient-management
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MEDICAL_MODULE=patient_management
      - HIPAA_ENCRYPTION_KEY=${HIPAA_ENCRYPTION_KEY}
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Micro-frontend: Appointment Scheduling
  appointment-scheduling:
    build:
      context: .
      dockerfile: Dockerfile.appointment-scheduling
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - MEDICAL_MODULE=appointment_scheduling
      - HIPAA_ENCRYPTION_KEY=${HIPAA_ENCRYPTION_KEY}
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Micro-frontend: Telemedicine
  telemedicine:
    build:
      context: .
      dockerfile: Dockerfile.telemedicine
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - MEDICAL_MODULE=telemedicine
      - HIPAA_ENCRYPTION_KEY=${HIPAA_ENCRYPTION_KEY}
      - WEBRTC_STUN_SERVERS=${WEBRTC_STUN_SERVERS}
      - WEBRTC_TURN_SERVERS=${WEBRTC_TURN_SERVERS}
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Backend optimizada
  altamedica-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - HIPAA_ENCRYPTION_KEY=${HIPAA_ENCRYPTION_KEY}
      - AUDIT_LOG_LEVEL=full
    networks:
      - altamedica-network
    depends_on:
      - postgres-db
      - redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Base de datos PostgreSQL con encriptación
  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=altamedica
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d altamedica"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/server.crt
      -c ssl_key_file=/etc/ssl/private/server.key
      -c shared_preload_libraries=pg_stat_statements
      -c log_statement=all
      -c log_min_duration_statement=1000

  # Redis para cache médico optimizado
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitor de performance médica
  medical-monitor:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - MONITOR_TARGETS=altamedica-shell,patient-management,appointment-scheduling,telemedicine
      - ALERT_WEBHOOKS=${ALERT_WEBHOOKS}
    networks:
      - altamedica-network
    depends_on:
      - altamedica-shell
    restart: unless-stopped

  # Nginx como proxy reverso y load balancer
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    networks:
      - altamedica-network
    depends_on:
      - altamedica-shell
      - patient-management
      - appointment-scheduling
      - telemedicine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch para logs de auditoría HIPAA
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Logstash para procesamiento de logs médicos
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config:/usr/share/logstash/config
    networks:
      - altamedica-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Kibana para visualización de auditoría
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    networks:
      - altamedica-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

networks:
  altamedica-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

# Configuración de secrets para producción
secrets:
  hipaa_encryption_key:
    external: true
  db_password:
    external: true
  jwt_secret:
    external: true
  redis_password:
    external: true