version: '3.8'

services:
  # ===== APLICACIONES ALTAMEDICA =====
  
  # Gateway principal - CRÍTICO
  web-app:
    image: node:22-alpine
    container_name: altamedica-web-app
    working_dir: /app
    command: sh -c "npm install -g pnpm && cd apps/web-app && pnpm install && pnpm dev"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://api-server:3001
      - NEXT_PUBLIC_WEB_APP_URL=http://localhost:3000
    env_file:
      - .env.docker
    depends_on:
      - redis
      - postgres
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Server - CORE BACKEND
  api-server:
    image: node:22-alpine
    container_name: altamedica-api-server
    working_dir: /app
    command: sh -c "npm install -g pnpm && cd apps/api-server && pnpm install && pnpm dev"
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://altamedica:altamedica123@postgres:5432/altamedica
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Portal Médicos
  doctors:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: altamedica-doctors
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - NEXT_PUBLIC_API_BASE_URL=http://api-server:3001
      - NEXT_PUBLIC_WEB_APP_URL=http://web-app:3000
      - NEXT_PUBLIC_SIGNALING_SERVER=ws://signaling-server:8888
    env_file:
      - .env.docker
    depends_on:
      - api-server
      - signaling-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Portal Pacientes
  patients:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: altamedica-patients
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NEXT_PUBLIC_API_BASE_URL=http://api-server:3001
      - NEXT_PUBLIC_WEB_APP_URL=http://web-app:3000
      - NEXT_PUBLIC_SIGNALING_SERVER=ws://signaling-server:8888
    env_file:
      - .env.docker
    depends_on:
      - api-server
      - signaling-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Portal Empresas
  companies:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: altamedica-companies
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - NEXT_PUBLIC_API_BASE_URL=http://api-server:3001
      - NEXT_PUBLIC_WEB_APP_URL=http://web-app:3000
    env_file:
      - .env.docker
    depends_on:
      - api-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Panel Administración
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: altamedica-admin
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NEXT_PUBLIC_API_BASE_URL=http://api-server:3001
      - NEXT_PUBLIC_WEB_APP_URL=http://web-app:3000
    env_file:
      - .env.docker
    depends_on:
      - api-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Servidor de Señalización WebRTC
  signaling-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: altamedica-signaling
    ports:
      - "8888:8888"
      - "10000-10100:10000-10100/udp"  # Puertos WebRTC
    environment:
      - NODE_ENV=production
      - PORT=8888
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.docker
    depends_on:
      - redis
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== SERVICIOS DE INFRAESTRUCTURA =====

  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: altamedica-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: altamedica
      POSTGRES_USER: altamedica
      POSTGRES_PASSWORD: altamedica123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api-server/database/init:/docker-entrypoint-initdb.d
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altamedica -d altamedica"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis para caching y sessiones
  redis:
    image: redis:7-alpine
    container_name: altamedica-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass altamedica123
    volumes:
      - redis_data:/data
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: altamedica-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web-app
      - api-server
      - doctors
      - patients
      - companies
      - admin
    networks:
      - altamedica-network
    restart: unless-stopped

  # ===== MONITOREO Y OBSERVABILIDAD =====

  # Prometheus - Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: altamedica-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./apps/api-server/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - altamedica-network
    restart: unless-stopped

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: altamedica-grafana
    ports:
      - "3006:3000"  # Puerto diferente para evitar conflicto
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: altamedica123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - altamedica-network
    restart: unless-stopped

  # Node Exporter - Métricas del sistema
  node-exporter:
    image: prom/node-exporter:latest
    container_name: altamedica-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - altamedica-network
    restart: unless-stopped

  # Fluentd - Logging centralizado
  fluentd:
    image: fluent/fluentd:v1.14-debian-1
    container_name: altamedica-fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./logs:/fluentd/log
    networks:
      - altamedica-network
    restart: unless-stopped

# ===== VOLÚMENES PERSISTENTES =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ===== RED PERSONALIZADA =====
networks:
  altamedica-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16