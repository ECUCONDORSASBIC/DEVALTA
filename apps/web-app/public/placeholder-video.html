<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .placeholder {
            text-align: center;
            color: #fff;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .text {
            font-size: 18px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="placeholder">
        <div class="icon">🎥</div>
        <div class="text">Video de demostración médica</div>
    </div>
</body>
</html>
