<?xml version="1.0" encoding="UTF-8"?>
<svg width="2048" height="1024" viewBox="0 0 2048 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo del cielo -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cielo -->
  <rect width="2048" height="1024" fill="url(#skyGradient)"/>
  
  <!-- Nubes -->
  <ellipse cx="300" cy="150" rx="80" ry="40" fill="white" opacity="0.8"/>
  <ellipse cx="400" cy="140" rx="60" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="500" cy="160" rx="70" ry="35" fill="white" opacity="0.8"/>
  
  <ellipse cx="800" cy="120" rx="90" ry="45" fill="white" opacity="0.7"/>
  <ellipse cx="900" cy="110" rx="70" ry="35" fill="white" opacity="0.7"/>
  
  <ellipse cx="1400" cy="180" rx="85" ry="42" fill="white" opacity="0.6"/>
  <ellipse cx="1500" cy="170" rx="65" ry="32" fill="white" opacity="0.6"/>
  
  <!-- Hospital de Clínicas José de San Martín - Edificio principal -->
  <rect x="600" y="400" width="800" height="600" fill="url(#buildingGradient)" stroke="#CCCCCC" stroke-width="2"/>
  
  <!-- Ventanas del edificio principal -->
  <g fill="#B8D4E3" stroke="#8BA9C4" stroke-width="1">
    <!-- Primera fila de ventanas -->
    <rect x="650" y="450" width="60" height="80"/>
    <rect x="750" y="450" width="60" height="80"/>
    <rect x="850" y="450" width="60" height="80"/>
    <rect x="950" y="450" width="60" height="80"/>
    <rect x="1050" y="450" width="60" height="80"/>
    <rect x="1150" y="450" width="60" height="80"/>
    <rect x="1250" y="450" width="60" height="80"/>
    
    <!-- Segunda fila de ventanas -->
    <rect x="650" y="570" width="60" height="80"/>
    <rect x="750" y="570" width="60" height="80"/>
    <rect x="850" y="570" width="60" height="80"/>
    <rect x="950" y="570" width="60" height="80"/>
    <rect x="1050" y="570" width="60" height="80"/>
    <rect x="1150" y="570" width="60" height="80"/>
    <rect x="1250" y="570" width="60" height="80"/>
    
    <!-- Tercera fila de ventanas -->
    <rect x="650" y="690" width="60" height="80"/>
    <rect x="750" y="690" width="60" height="80"/>
    <rect x="850" y="690" width="60" height="80"/>
    <rect x="950" y="690" width="60" height="80"/>
    <rect x="1050" y="690" width="60" height="80"/>
    <rect x="1150" y="690" width="60" height="80"/>
    <rect x="1250" y="690" width="60" height="80"/>
  </g>
  
  <!-- Entrada principal -->
  <rect x="950" y="850" width="100" height="150" fill="#2C5F2D" stroke="#1B4D1B" stroke-width="2"/>
  <rect x="970" y="870" width="60" height="110" fill="#4A90E2" stroke="#2E5B8A" stroke-width="1"/>
  
  <!-- Cruz médica en la entrada -->
  <g fill="#FF0000" stroke="#CC0000" stroke-width="2">
    <rect x="980" y="900" width="40" height="8"/>
    <rect x="996" y="884" width="8" height="40"/>
  </g>
  
  <!-- Letrero del hospital -->
  <rect x="900" y="350" width="200" height="40" fill="#2C5F2D" stroke="#1B4D1B" stroke-width="2"/>
  <text x="1000" y="375" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    HOSPITAL DE CLÍNICAS
  </text>
  <text x="1000" y="390" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">
    José de San Martín
  </text>
  
  <!-- Edificio lateral izquierdo -->
  <rect x="400" y="500" width="200" height="500" fill="url(#buildingGradient)" stroke="#CCCCCC" stroke-width="2"/>
  
  <!-- Edificio lateral derecho -->
  <rect x="1400" y="500" width="200" height="500" fill="url(#buildingGradient)" stroke="#CCCCCC" stroke-width="2"/>
  
  <!-- Ventanas edificios laterales -->
  <g fill="#B8D4E3" stroke="#8BA9C4" stroke-width="1">
    <!-- Edificio izquierdo -->
    <rect x="420" y="530" width="40" height="60"/>
    <rect x="480" y="530" width="40" height="60"/>
    <rect x="540" y="530" width="40" height="60"/>
    <rect x="420" y="620" width="40" height="60"/>
    <rect x="480" y="620" width="40" height="60"/>
    <rect x="540" y="620" width="40" height="60"/>
    <rect x="420" y="710" width="40" height="60"/>
    <rect x="480" y="710" width="40" height="60"/>
    <rect x="540" y="710" width="40" height="60"/>
    
    <!-- Edificio derecho -->
    <rect x="1420" y="530" width="40" height="60"/>
    <rect x="1480" y="530" width="40" height="60"/>
    <rect x="1540" y="530" width="40" height="60"/>
    <rect x="1420" y="620" width="40" height="60"/>
    <rect x="1480" y="620" width="40" height="60"/>
    <rect x="1540" y="620" width="40" height="60"/>
    <rect x="1420" y="710" width="40" height="60"/>
    <rect x="1480" y="710" width="40" height="60"/>
    <rect x="1540" y="710" width="40" height="60"/>
  </g>
  
  <!-- Árboles y vegetación -->
  <g fill="#228B22" stroke="#006400" stroke-width="1">
    <ellipse cx="200" cy="950" rx="40" ry="60"/>
    <ellipse cx="1800" cy="950" rx="40" ry="60"/>
    <ellipse cx="300" cy="950" rx="35" ry="55"/>
    <ellipse cx="1700" cy="950" rx="35" ry="55"/>
  </g>
  
  <!-- Troncos de árboles -->
  <rect x="195" y="950" width="10" height="50" fill="#8B4513"/>
  <rect x="1795" y="950" width="10" height="50" fill="#8B4513"/>
  <rect x="295" y="950" width="10" height="50" fill="#8B4513"/>
  <rect x="1695" y="950" width="10" height="50" fill="#8B4513"/>
  
  <!-- Suelo -->
  <rect x="0" y="1000" width="2048" height="24" fill="#90EE90"/>
</svg>