receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"
          allowed_headers:
            - "*"
  
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']
        - job_name: 'agents'
          scrape_interval: 15s
          static_configs:
            - targets: 
              - 'auth-agent:3001'
              - 'routing-agent:3002'
              - 'security-agent:3006'
              - 'monitoring-agent:3007'
              - 'devops-agent:3008'
  
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256
    
  attributes:
    actions:
      - key: environment
        value: production
        action: upsert
      - key: service.namespace
        value: altamedica
        action: upsert
      - key: service.version
        from_attribute: app_version
        action: insert
        
  resource:
    attributes:
      - key: host.name
        from_attribute: k8s.node.name
        action: upsert
      - key: cloud.region
        value: ${CLOUD_REGION}
        action: insert
        
  span:
    name:
      from_attributes: ["http.method", "http.route"]
      separator: " "
    status:
      code: Error
      description: "HTTP error"
      
  probabilistic_sampler:
    sampling_percentage: 10
    
  tail_sampling:
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow_traces
        type: latency
        latency: {threshold_ms: 1000}
      - name: important_services
        type: and
        and:
          and_sub_policy:
            - name: service_name
              type: string_attribute
              string_attribute:
                key: service.name
                values: ["auth-agent", "security-agent"]
            - name: minimum_duration
              type: latency
              latency: {threshold_ms: 100}

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: altamedica
    const_labels:
      environment: ${ENVIRONMENT}
    resource_to_telemetry_conversion:
      enabled: true
      
  jaeger:
    endpoint: jaeger-collector:14250
    tls:
      insecure: true
      
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
      
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200
    
  otlphttp/datadog:
    endpoint: https://trace.agent.datadoghq.com
    headers:
      DD-API-KEY: ${DD_API_KEY}
      
  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"
    format: proto
    
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      attributes:
        service.name: service_name
        service.namespace: service_namespace
        severity: severity
        
  elasticsearch:
    endpoints: ["https://elasticsearch:9200"]
    index: traces
    pipeline: traces_pipeline
    auth:
      authenticator: basicauth/client

extensions:
  health_check:
    endpoint: :13133
    path: "/health"
    
  pprof:
    endpoint: :1777
    
  zpages:
    endpoint: :55679
    
  basicauth/client:
    client_auth:
      username: ${ELASTIC_USER}
      password: ${ELASTIC_PASSWORD}

service:
  extensions: [health_check, pprof, zpages, basicauth/client]
  
  pipelines:
    traces:
      receivers: [otlp, jaeger]
      processors: [memory_limiter, batch, attributes, resource, span, tail_sampling]
      exporters: [jaeger, otlp/tempo, logging, zipkin]
      
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch, attributes, resource]
      exporters: [prometheus, logging]
      
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes, resource]
      exporters: [loki, elasticsearch, logging]
      
  telemetry:
    logs:
      level: info
      initial_fields:
        service: otel-collector
    metrics:
      level: detailed
      address: :8888
