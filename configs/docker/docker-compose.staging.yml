# 🎯 ALTAMEDICA - Staging Environment
version: '3.8'

services:
  # 🏥 API Server
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=staging
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - altamedica-staging

  # 🏢 Companies App
  companies:
    build:
      context: .
      dockerfile: apps/companies/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=staging
      - API_URL=http://api-server:3001
    depends_on:
      - api-server
    restart: unless-stopped
    networks:
      - altamedica-staging

  # 👩‍⚕️ Doctors App
  doctors:
    build:
      context: .
      dockerfile: apps/doctors/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=staging
      - API_URL=http://api-server:3001
    depends_on:
      - api-server
    restart: unless-stopped
    networks:
      - altamedica-staging

  # 📊 Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - altamedica-staging

  # 📈 Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=altamedica2025
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    restart: unless-stopped
    networks:
      - altamedica-staging

  # 🚨 AlertManager
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped
    networks:
      - altamedica-staging

  # 🔄 Load Balancer (Nginx)
  load-balancer:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-server
      - companies
      - doctors
    restart: unless-stopped
    networks:
      - altamedica-staging

volumes:
  grafana-data:

networks:
  altamedica-staging:
    driver: bridge
