# 🏥 ALTAMEDICA PLATFORM - Docker Compose OPTIMIZADO
# Autor: Eduardo - Optimizado por Claude
# Fecha: 2025-01-30

version: '3.8'

services:
  # ===== APLICACIONES ALTAMEDICA (DESARROLLO) =====
  
  # Web App Principal - Puerto 3000
  web-app:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile.dev
      target: development
    container_name: altamedica-web-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
      - NEXT_PUBLIC_SIGNALING_SERVER=ws://localhost:8888
      - CHOKIDAR_USEPOLLING=true  # Para hot reload en Windows
    volumes:
      - ./apps/web-app:/app
      - /app/node_modules
      - ./logs/web-app:/app/logs
    depends_on:
      - api-server
      - redis
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health || http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Server - Puerto 3001
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile.dev
      target: development
    container_name: altamedica-api-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://altamedica:altamedica123@postgres:5432/altamedica
      - REDIS_URL=redis://:altamedica123@redis:6379
      - JWT_SECRET=altamedica-jwt-secret-dev
    volumes:
      - ./apps/api-server:/app
      - /app/node_modules
      - ./logs/api-server:/app/logs
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Portal Médicos - Puerto 3002
  doctors:
    build:
      context: .
      dockerfile: apps/doctors/Dockerfile.dev
      target: development
    container_name: altamedica-doctors
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
      - NEXT_PUBLIC_SIGNALING_SERVER=ws://localhost:8888
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/doctors:/app
      - /app/node_modules
      - ./logs/doctors:/app/logs
    depends_on:
      - api-server
      - signaling-server
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Portal Pacientes - Puerto 3003  
  patients:
    build:
      context: .
      dockerfile: apps/patients/Dockerfile.dev
      target: development
    container_name: altamedica-patients
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
      - NEXT_PUBLIC_SIGNALING_SERVER=ws://localhost:8888
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/patients:/app
      - /app/node_modules
      - ./logs/patients:/app/logs
    depends_on:
      - api-server  
      - signaling-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Portal Empresas - Puerto 3004
  companies:
    build:
      context: .
      dockerfile: apps/companies/Dockerfile.dev
      target: development
    container_name: altamedica-companies
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/companies:/app
      - /app/node_modules
      - ./logs/companies:/app/logs
    depends_on:
      - api-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Panel Admin - Puerto 3005
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.dev
      target: development
    container_name: altamedica-admin
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - ./logs/admin:/app/logs
    depends_on:
      - api-server
    networks:
      - altamedica-network
    restart: unless-stopped

  # Signaling Server WebRTC - Puerto 8888
  signaling-server:
    build:
      context: .
      dockerfile: apps/signaling-server/Dockerfile.dev
      target: development
    container_name: altamedica-signaling
    ports:
      - "8888:8888"
      - "10000-10100:10000-10100/udp"  # Puertos WebRTC
    environment:
      - NODE_ENV=development
      - PORT=8888
      - REDIS_URL=redis://:altamedica123@redis:6379
    volumes:
      - ./apps/signaling-server:/app
      - /app/node_modules
      - ./logs/signaling:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== SERVICIOS DE INFRAESTRUCTURA =====

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: altamedica-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: altamedica
      POSTGRES_USER: altamedica
      POSTGRES_PASSWORD: altamedica123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api-server/database/init:/docker-entrypoint-initdb.d:ro
      - ./logs/postgres:/var/log/postgresql
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altamedica -d altamedica"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: altamedica-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass altamedica123
    volumes:
      - redis_data:/data
      - ./logs/redis:/var/log/redis
    networks:
      - altamedica-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "altamedica123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== MONITOREO (OPCIONAL PARA DESARROLLO) =====

  # Adminer - Database Admin
  adminer:
    image: adminer:latest
    container_name: altamedica-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - altamedica-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Redis Commander - Redis Admin  
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: altamedica-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:altamedica123
    depends_on:
      - redis
    networks:
      - altamedica-network
    restart: unless-stopped
    profiles:
      - monitoring

# ===== VOLÚMENES PERSISTENTES =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ===== RED PERSONALIZADA =====
networks:
  altamedica-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16